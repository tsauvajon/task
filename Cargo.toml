[package]
name = "task"
version = "7.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.3"
comfy-table = "7.2.2"
crossterm = "0.29.0"
dialoguer = "0.12.0"
indicatif = "0.18"
owo-colors = "4.3.0"
ratatui = "0.30.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rayon = "1.12"
thiserror = "2"
toml = "1.1.2"
strum = { version = "0.28", features = ["derive"] }

[lints.clippy]
# Tiers
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Hardened individual lints
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
as_underscore = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "deny"
doc_markdown = "deny"
empty_drop = "deny"
empty_structs_with_brackets = "deny"
exit = "deny"
expl_impl_clone_on_copy = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
filetype_is_file = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
fn_params_excessive_bools = "deny"
fn_to_numeric_cast_any = "deny"
format_push_string = "deny"
future_not_send = "deny"
get_unwrap = "deny"
if_let_mutex = "deny"
if_then_some_else_none = "deny"
invalid_upcast_comparisons = "deny"
indexing_slicing = "deny"
items_after_statements = "deny"
iter_not_returning_iterator = "deny"
large_futures = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
missing_const_for_fn = "deny"
missing_panics_doc = "deny"
mixed_read_write_in_expression = "deny"
modulo_arithmetic = "deny"
multiple_inherent_impl = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
must_use_candidate = "deny"
needless_pass_by_value = "deny"
needless_raw_strings = "deny"
non_zero_suggestions = "deny"
panic = "deny"
partial_pub_fields = "deny"
print_stderr = "deny"
print_stdout = "deny"
pub_without_shorthand = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_closure = "deny"
redundant_pub_crate = "deny"
ref_patterns = "deny"
rest_pat_in_fully_bound_structs = "deny"
return_self_not_must_use = "deny"
same_name_method = "deny"
self_named_module_files = "deny"
semicolon_inside_block = "deny"
shadow_unrelated = "deny"
significant_drop_tightening = "deny"
similar_names = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
tests_outside_test_module = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnested_or_patterns = "deny"
unreachable = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unseparated_literal_suffix = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
unwrap_in_result = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"
wrong_self_convention = "deny"

# Not clearly adding value
module_name_repetitions = "allow" # Still evaluating this rule
multiple_crate_versions = "allow" # Still evaluating this rule
missing_errors_doc = "allow" # Makes docs way too verbose, doesn't solve a real problem
single_call_fn = "allow" # Lots of false positives, little real signal
cargo_common_metadata = "allow" # We don't care
option_if_let_else = "allow" # Style preference; map_or and map_or_else have confusing syntax

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(dylint_lib, values(any()))"] }
